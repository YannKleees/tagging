[package]
name = "tagging-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Span-preserving tokenizer and rule-based PII detectors"

[lib]
name = "tagging_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tagging"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"], optional = true }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[features]
python = ["dep:pyo3", "pyo3/extension-module"]
