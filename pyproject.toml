[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tagging"
version = "0.1.0"
description = "PII detection and redaction for English, French, German and Luxembourgish documents"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# gliner_multi_pii-v1 ships a SentencePiece tokenizer that transformers 5 fails to convert.
ner = ["gliner>=0.2.29", "transformers>=4.51.3,<5", "protobuf>=4", "numpy>=1.26"]
eval = ["faker>=30", "pandas>=2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.maturin]
manifest-path = "core/Cargo.toml"
module-name = "tagging._core"
python-source = "."
features = ["python"]

[tool.ruff]
line-length = 120
extend-exclude = ["core"]
src = [".", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Word lists are kept as split strings for readability.
"tagging/postprocess.py" = ["SIM905"]
